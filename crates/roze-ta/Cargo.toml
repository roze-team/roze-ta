[package]
name = "roze-ta"
version.workspace = true
edition.workspace = true
license = "MIT AND Apache-2.0 AND BSD-3-Clause"
description = "Native Rust technical analysis with reproducible indicator profiles"
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror = "=2.0.20"
rayon = { version = "=1.12.0", optional = true }
statrs = { version = "=0.19.1", default-features = false }
rand = { version = "=0.9.5", default-features = false, features = ["std"] }
rand_chacha = { version = "=0.9.0", default-features = false, features = ["std"] }
bincode = { version = "=2.0.1", default-features = false, features = ["std", "serde"] }
schemars = { version = "1", optional = true }

[features]
schema = ["dep:schemars"]
wickra-parallel = ["dep:rayon"]

[dev-dependencies]
approx = "=0.5.1"
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[[example]]
name = "export_schema"
required-features = ["schema"]
